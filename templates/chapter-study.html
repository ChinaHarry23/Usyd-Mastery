<body>
<nav id="sidebar">
  <div class="sidebar-header">
    <div>
      <a href="{{HUB_ROOT}}/index.html" style="text-decoration:none; color:var(--text-muted); font-size:0.78rem; display:flex; align-items:center; gap:0.3rem; margin-bottom:0.4rem; transition:color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">&larr; Course Home</a>

      <h2>{{CHAPTER_LABEL}}</h2>

{{CONTENT}}

</main>
